[package]
name = "input-overlay-ws"
version.workspace = true
description = "Input Overlay WebSocket Server"
authors = []
edition = "2021"

[build-dependencies]
cmake = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
io-ws-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rust-embed = { version = "8", features = ["interpolate-folder-path"] }
rand = "0.8"
time = "=0.3.36"
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp"] }
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2", features = ["linux-static-hidraw"] }
evdev = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
zbus = "5.9"

[target.'cfg(windows)'.dependencies]
hidapi = "2"
reqwest = { version = "0.12", features = ["json", "stream"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.60", features = [
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }
