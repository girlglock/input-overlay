name: build

on:
  workflow_call:
    inputs:
      windows-artifact-name:
        type: string
        default: windows-zip
      linux-artifact-name:
        type: string
        default: linux-zip
      linux-appimage-artifact-name:
        type: string
        default: linux-appimage
      obs-plugin-artifact-name:
        type: string
        default: obs-plugin-windows
      obs-plugin-linux-artifact-name:
        type: string
        default: obs-plugin-linux
      retention-days:
        type: number
        default: 0

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2

      - name: build
        run: cargo build --release

      - name: attest windows build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            target/release/input-overlay-ws.exe
            target/release/input_overlay_obs_plugin.dll

      - name: upload windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.windows-artifact-name }}
          path: target/release/input-overlay-ws.exe
          retention-days: ${{ inputs.retention-days }}

      - name: stage obs plugin package
        shell: bash
        run: |
          pkg=target/obs-plugin-package/obs-studio/plugins/input_overlay_obs_plugin
          mkdir -p "$pkg/data"
          cp target/release/input_overlay_obs_plugin.dll "$pkg/"
          cp -r obs-plugin/fonts "$pkg/input-overlay-fonts"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed "s|{{VERSION}}|$version|" obs-plugin/manifest.json > "$pkg/data/manifest.json"

      - name: upload obs plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.obs-plugin-artifact-name }}
          path: target/obs-plugin-package/
          retention-days: ${{ inputs.retention-days }}

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libgl-dev \
            libudev-dev

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2

      - name: build ws-server binary
        run: cargo build --release --package input-overlay-ws

      - name: attest linux build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/release/input-overlay-ws

      - name: upload linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.linux-artifact-name }}
          path: target/release/input-overlay-ws
          retention-days: ${{ inputs.retention-days }}

      - name: build AppImage
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp target/release/input-overlay-ws AppDir/usr/bin/
          cp ws-server/icons/icon.png AppDir/input-overlay-ws.png
          ln -s usr/bin/input-overlay-ws AppDir/AppRun
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=Input Overlay WS' \
            'Exec=input-overlay-ws' 'Icon=input-overlay-ws' 'Categories=Utility;' 'Terminal=false' \
            > AppDir/input-overlay-ws.desktop
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir target/release/input-overlay-ws_x86_64.AppImage

      - name: upload linux appimage artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.linux-appimage-artifact-name }}
          path: target/release/input-overlay-ws_x86_64.AppImage
          retention-days: ${{ inputs.retention-days }}

      - name: build obs plugin (linux)
        run: cargo build --release --package input-overlay-obs-plugin

      - name: attest linux obs plugin build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: target/release/libinput_overlay_obs_plugin.so

      - name: stage linux obs plugin package
        run: |
          pkg=target/obs-plugin-package/obs-studio/plugins/input_overlay_obs_plugin
          mkdir -p "$pkg/data"
          cp target/release/libinput_overlay_obs_plugin.so "$pkg/"
          cp -r obs-plugin/fonts "$pkg/input-overlay-fonts"
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          sed "s|{{VERSION}}|$version|" obs-plugin/manifest.json > "$pkg/data/manifest.json"

      - name: upload linux obs plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.obs-plugin-linux-artifact-name }}
          path: target/obs-plugin-package/
          retention-days: ${{ inputs.retention-days }}
