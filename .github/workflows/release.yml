name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      windows-artifact-name: windows-zip
      linux-artifact-name: linux-zip
      linux-appimage-artifact-name: linux-appimage
      obs-plugin-artifact-name: obs-plugin-windows
      obs-plugin-linux-artifact-name: obs-plugin-linux

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-zip

      - name: download linux appimage artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: download obs plugin windows artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-plugin-windows

      - name: download obs plugin linux artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-plugin-linux

      - name: create release zips
        run: |
          zip input-overlay-ws-windows.zip input-overlay-ws.exe
          zip input-overlay-ws-linux.zip input-overlay-ws
          mv input-overlay-ws_*.AppImage input-overlay-ws.AppImage
          mkdir -p obs-studio/obs-plugins/64bit
          cp input_overlay_obs_plugin.dll obs-studio/obs-plugins/64bit/
          cp libinput_overlay_obs_plugin.so obs-studio/obs-plugins/64bit/
          zip -r input-overlay-obs-plugin.zip obs-studio/

      - name: attest release artifacts
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            input-overlay-ws-windows.zip
            input-overlay-ws-linux.zip
            input-overlay-ws.AppImage
            input-overlay-obs-plugin.zip

      - name: get previous tag
        id: prev_tag
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: make release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            input-overlay-ws-windows.zip
            input-overlay-ws-linux.zip
            input-overlay-ws.AppImage
            input-overlay-obs-plugin.zip
          body: |
            ## input-overlay websocket server ${{ github.ref_name }}

            # **Patchnotes:**

            -

            # **Setup:**

            ## windows

            <details>
            <summary><b>obs plugin setup</b></summary>
            <br>

            1. download `input-overlay-obs-plugin.zip` and unzip it
            2. merge the directory into your obs-studio install, eg `C:\Program Files\obs-studio\`
            3. launch obs with admin
            4. add a new source via **Add Source -> Input Overlay**, then configure it in its properties

            </details>

            <details>
            <summary><b>standalone ws server setup</b></summary>
            <br>

            1. download `input-overlay-ws-windows.zip`
            2. unzip and run `input-overlay-ws.exe`
            3. right-click the tray icon for settings

            > [!NOTE]
            > you might need to run the ws server as admin when tabbed into apps that run with admin elevations themselves
            > the "start with windows" checkbox will automatically start the ws server with admin rights on the next boot

            </details>

            ## linux

            <details>
            <summary><b>needed perms and rules</b></summary>
            <br>

            these steps let input-overlay read your keyboard/mouse devices. do this before using either setup method below.

            1. add yourself to the `input` group

               ```bash
               sudo usermod -aG input $USER
               ```

               if the one above fails you might be on a immutable distro (bazzite, bluefin, openSUSE Aeon, etc etc). try this then:

               ```bash
               echo "input:x:$(getent group input | cut -d: -f3):$USER" | sudo tee -a /etc/group
               ```

            2. set up analog support *(optional)*:

               ```bash
               printf '%s\n' \
                 'KERNEL=="hidraw*", SUBSYSTEM=="hidraw", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="31e3", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="03eb", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="1532", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="19f5", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="352d", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="3434", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="362d", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="373b", MODE="0660", GROUP="input"' \
                 'SUBSYSTEM=="usb", ATTRS{idVendor}=="372e", MODE="0660", GROUP="input"' \
                 | sudo tee /etc/udev/rules.d/99-analog.rules
               sudo udevadm control --reload-rules && sudo udevadm trigger
               ```

            3. reboot

            </details>

            <details>
            <summary><b>obs plugin setup</b></summary>
            <br>

            > [!IMPORTANT]
            > the obs plugin version does **not** include all features, will **not** receive automatic update checks, and is only intended for **single pc setups** (obs and the game running on the same peesee)

            1. download `input-overlay-obs-plugin.zip` and unzip it
            2. merge the directory into your obs-studio install, eg `~/.config/obs-studio/` *(or whereever your obs folder is :p)*
            3. launch obs, add a new source via `Add Source -> Input Overlay`, then configure it in its properties

            </details>

            <details>
            <summary><b>standalone ws server setup (experimental)</b></summary>
            <br>

            download `input-overlay-ws-linux.zip` and unzip it, then follow the steps below.

            1. install runtime dependencies:

               ```bash
               # debian / ubuntu
               sudo apt-get install libwebkit2gtk-4.1-0 libgtk-3-0 libayatana-appindicator3-1 librsvg2-2

               # fedora
               sudo dnf install webkit2gtk4.1 gtk3 libayatana-appindicator librsvg2

               # arch
               sudo pacman -S webkit2gtk-4.1 gtk3 libayatana-appindicator librsvg
               ```

               an appimage build is also available which should run on most distros without installing dependencies at the cost of being hughmungous in comparison

            2. run `./input-overlay-ws`
            3. right-click the tray icon and open settings -> devices to pick your keyboard and mouse evdev devices

               some mice and keyboards might show up duplicate (nkro, wireless dongle, keyboard mouse button emulation for macros, mouse keyboard macros etc etc), you will just kinda have to try and error them)

            </details>

            ---
            > [!WARNING]
            > all builds are created via github actions directly from the repo sources
            > the ws server might occasionally trigger a false positive on windows defender due to it not being signed and how we handle rawinputbuffer reads via an "invisible background window"
            > alternatively you can build the it yourself. see the readme for instructions :p

            ${{ steps.prev_tag.outputs.tag != '' && format('[CHANGELOG]({0}/{1}/compare/{2}...{3})', github.server_url, github.repository, steps.prev_tag.outputs.tag, github.ref_name) || 'First release.' }}

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
