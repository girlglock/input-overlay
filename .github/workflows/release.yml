name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    uses: ./.github/workflows/_build.yml
    with:
      windows-artifact-name: windows-zip
      linux-artifact-name: linux-zip
      linux-appimage-artifact-name: linux-appimage
      obs-plugin-artifact-name: obs-plugin-windows
      obs-plugin-linux-artifact-name: obs-plugin-linux

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-zip

      - name: download linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-zip

      - name: download linux appimage artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage

      - name: download obs plugin windows artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-plugin-windows
          path: obs-plugin-windows-artifact

      - name: download obs plugin linux artifact
        uses: actions/download-artifact@v4
        with:
          name: obs-plugin-linux
          path: obs-plugin-linux-artifact

      - name: create release zips
        run: |
          zip input-overlay-ws-windows.zip input-overlay-ws.exe
          zip input-overlay-ws-linux.zip input-overlay-ws
          mv input-overlay-ws_*.AppImage input-overlay-ws.AppImage
          mkdir -p obs-plugin-windows/obs-studio/obs-plugins/64bit
          cp -r obs-plugin-windows-artifact/. obs-plugin-windows/obs-studio/obs-plugins/64bit/
          (cd obs-plugin-windows && zip -r ../input-overlay-obs-plugin-windows.zip obs-studio/)
          mkdir -p obs-plugin-linux/obs-studio/obs-plugins/64bit
          cp -r obs-plugin-linux-artifact/. obs-plugin-linux/obs-studio/obs-plugins/64bit/
          (cd obs-plugin-linux && zip -r ../input-overlay-obs-plugin-linux.zip obs-studio/)

      - name: attest release artifacts
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            input-overlay-ws-windows.zip
            input-overlay-ws-linux.zip
            input-overlay-ws.AppImage
            input-overlay-obs-plugin-windows.zip
            input-overlay-obs-plugin-linux.zip

      - name: get previous tag
        id: prev_tag
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "tag=$prev" >> "$GITHUB_OUTPUT"

      - name: build release notes
        run: |
          {
            sed \
              -e "s|{{TAG}}|$GITHUB_REF_NAME|g" \
              -e "s|{{REPO}}|$GITHUB_REPOSITORY|g" \
              -e "s|{{SERVER_URL}}|$GITHUB_SERVER_URL|g" \
              .github/release-notes/header.md
            echo
            echo "# **Patchnotes:**"
            echo
            cat .github/release-notes/patchnotes.md
            echo
            echo "# **Setup:**"
            echo
            cat .github/release-notes/windows-setup.md
            echo
            cat .github/release-notes/linux-setup.md
            echo
            cat .github/release-notes/footer.md
            echo
            if [ -n "${{ steps.prev_tag.outputs.tag }}" ]; then
              echo "[CHANGELOG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/${{ steps.prev_tag.outputs.tag }}...$GITHUB_REF_NAME)"
            else
              echo "First release."
            fi
          } > RELEASE_BODY.md

      - name: make release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            input-overlay-ws-windows.zip
            input-overlay-ws-linux.zip
            input-overlay-ws.AppImage
            input-overlay-obs-plugin-windows.zip
            input-overlay-obs-plugin-linux.zip
          body_path: RELEASE_BODY.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
